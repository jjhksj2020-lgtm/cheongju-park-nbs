<style>
/* 발표용 껍데기 — 지도 앱(#app)은 그대로 두고, 앞뒤로 설명 페이지를 붙인다. 클래스는 모두 pz- 로 시작(지도 앱 CSS와 겹치지 않게). */
:root{--pz-use:#2f7d5a; --pz-heat:#c2562a; --pz-biz:#2b6cb0; --pz-comp:#c27a12; --pz-cons:#2b6cb0;
  --pz-ink:#16201b; --pz-muted:#56625c; --pz-line:#d9dfdb; --pz-soft:#f1f4f2; --pz-paper:#ffffff; --pz-bg:#f6f7f6}
body{background:var(--pz-bg);padding:0!important;margin:0}
.pz-top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--pz-line)}
.pz-top-in{max-width:1240px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.pz-brand{font-weight:700;font-size:14px;letter-spacing:-.01em;color:var(--pz-ink);margin-right:auto}
.pz-brand small{display:block;font-weight:500;font-size:11.5px;color:var(--pz-muted)}
.pz-steps{display:flex;gap:4px;flex-wrap:wrap}
.pz-steps button{display:flex;align-items:center;gap:7px;border:1px solid transparent;background:transparent;color:var(--pz-muted);font:inherit;font-size:13px;font-weight:600;padding:6px 11px;border-radius:999px;cursor:pointer}
.pz-steps button i{font-style:normal;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pz-soft);font-size:11px;color:var(--pz-muted)}
.pz-steps button[aria-current="step"]{color:var(--pz-ink);border-color:var(--pz-line);background:var(--pz-paper)}
.pz-steps button[aria-current="step"] i{background:var(--pz-ink);color:#fff}
.pz-steps button:hover{color:var(--pz-ink)}
.pz-main{max-width:1240px;margin:0 auto;padding:36px 24px 120px}
.pz-page{display:none}.pz-page.on{display:block;animation:pzin .35s ease}
@keyframes pzin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pz-eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--tc,var(--pz-muted));text-transform:uppercase}
h1.pz-h1{font-size:40px;line-height:1.2;font-weight:700;letter-spacing:-.025em;margin:10px 0 14px;color:var(--pz-ink);text-wrap:balance}
h2.pz-h2{font-size:30px;line-height:1.25;font-weight:700;letter-spacing:-.02em;margin:8px 0 12px;color:var(--pz-ink);text-wrap:balance}
h3.pz-h3{font-size:18px;font-weight:700;margin:0 0 14px;color:var(--pz-ink);display:flex;align-items:center;gap:10px}
h3.pz-h3 .n{font-size:12px;font-weight:700;color:#fff;background:var(--tc,var(--pz-ink));border-radius:6px;padding:2px 7px}
.pz-lead{font-size:17px;line-height:1.7;color:var(--pz-muted);max-width:820px;margin:0}
.pz-lead b{color:var(--pz-ink);font-weight:600}
.pz-block{background:var(--pz-paper);border:1px solid var(--pz-line);border-radius:16px;padding:26px 28px;margin-top:22px}
.pz-why{border-left:5px solid var(--tc);}
.pz-why h3.pz-h3{margin-bottom:10px}
.pz-why p{font-size:16px;line-height:1.75;margin:0;color:var(--pz-ink);max-width:900px}
.pz-why ul{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px}
.pz-why li{font-size:13px;background:var(--pz-soft);border-radius:999px;padding:5px 12px;color:var(--pz-muted)}
.pz-flow{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:14px;position:relative}
.pz-stepc{position:relative;background:var(--pz-soft);border-radius:12px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:6px}
.pz-stepc:not(:last-child)::after{content:"";position:absolute;right:-12px;top:50%;width:10px;height:10px;border-top:2px solid var(--pz-line);border-right:2px solid var(--pz-line);transform:translateY(-50%) rotate(45deg);z-index:1}
.pz-stepc .k{font-size:12px;font-weight:700;color:var(--tc)}
.pz-stepc .t{font-size:16px;font-weight:700;color:var(--pz-ink)}
.pz-stepc .d{font-size:13px;line-height:1.6;color:var(--pz-muted)}
.pz-stepc .f{font-family:var(--f-mono);font-size:12px;background:var(--pz-paper);border:1px solid var(--pz-line);border-radius:6px;padding:5px 8px;color:var(--pz-ink);margin-top:auto}
.pz-stepc .s{font-size:11.5px;color:var(--pz-muted)}
.pz-stepc.key{background:var(--pz-paper);box-shadow:inset 0 0 0 2px var(--tc)}
.pz-note{margin-top:14px;font-size:13.5px;line-height:1.65;color:var(--pz-ink);background:var(--pz-soft);border-radius:10px;padding:12px 14px}
.pz-note b{font-weight:700}
details.pz-more{margin-top:16px;border-top:1px solid var(--pz-line);padding-top:12px}
details.pz-more summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--pz-muted);list-style:none;display:inline-flex;align-items:center;gap:6px}
details.pz-more summary::-webkit-details-marker{display:none}
details.pz-more summary::before{content:"+";display:inline-grid;place-items:center;width:18px;height:18px;border:1px solid var(--pz-line);border-radius:5px;font-size:12px}
details.pz-more[open] summary::before{content:"−"}
details.pz-more summary:hover{color:var(--pz-ink)}
.pz-dl{display:grid;grid-template-columns:200px 1fr;gap:8px 18px;margin-top:12px;font-size:13px;line-height:1.6}
.pz-dl dt{color:var(--pz-muted);font-weight:600}.pz-dl dd{margin:0;color:var(--pz-ink)}
.pz-kpis{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:14px}
.pz-kpi{background:var(--pz-soft);border-radius:12px;padding:16px 18px}
.pz-kpi .l{font-size:12.5px;color:var(--pz-muted);font-weight:600}
.pz-kpi .v{font-size:30px;font-weight:700;letter-spacing:-.02em;color:var(--pz-ink);margin-top:4px;font-variant-numeric:tabular-nums;line-height:1.15}
.pz-kpi .v small{font-size:15px;font-weight:600;color:var(--pz-muted);margin-left:3px}
.pz-kpi .c{font-size:12px;color:var(--pz-muted);margin-top:4px;line-height:1.5}
.pz-kpi.hl{background:var(--pz-paper);box-shadow:inset 0 0 0 2px var(--tc)}
.pz-res{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;margin-top:22px}
.pz-sub{font-size:14px;font-weight:700;color:var(--pz-ink);margin:0 0 4px}
.pz-cap{font-size:12.5px;color:var(--pz-muted);margin:0 0 12px}
.pz-rank{display:flex;flex-direction:column;gap:9px}
.pz-r{display:grid;grid-template-columns:22px 118px minmax(0,1fr) 116px;align-items:center;gap:10px;font-size:13.5px}
.pz-r .no{font-weight:700;color:var(--pz-muted);font-variant-numeric:tabular-nums}
.pz-r .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pz-r .nm small{display:block;font-weight:400;font-size:11px;color:var(--pz-muted)}
.pz-r .tr{height:14px;background:var(--pz-soft);border-radius:0 4px 4px 0;display:flex;gap:2px}
.pz-r .tr span{display:block;height:100%}
.pz-r .tr span:last-child{border-radius:0 4px 4px 0}
.pz-r .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.pz-r .val small{display:block;font-size:11px;font-weight:400;color:var(--pz-muted)}
.pz-legend{display:flex;gap:14px;font-size:12px;color:var(--pz-muted);margin:-4px 0 12px}
.pz-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.pz-take{align-self:start;background:var(--pz-ink);color:#fff;border-radius:14px;padding:22px 24px;display:flex;flex-direction:column;gap:10px}
.pz-take .h{font-size:12px;font-weight:700;letter-spacing:.06em;opacity:.7}
.pz-take p{margin:0;font-size:16.5px;line-height:1.7}
.pz-take p b{color:#fff;font-weight:700;border-bottom:2px solid var(--tc)}
.pz-take ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.7;opacity:.88}
.pz-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pz-chips span{font-size:12px;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:2px 9px}
table.pz-t{width:100%;border-collapse:collapse;margin-top:12px;font-size:12.5px}
table.pz-t th{text-align:left;color:var(--pz-muted);font-weight:600;border-bottom:1px solid var(--pz-ink);padding:6px 8px;white-space:nowrap}
table.pz-t td{border-bottom:1px solid var(--pz-line);padding:6px 8px;font-variant-numeric:tabular-nums}
table.pz-t td.r,table.pz-t th.r{text-align:right}
table.pz-t tr:hover td{background:var(--pz-soft)}
.pz-dash{margin-top:22px}
.pz-dash-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.pz-dash-head .tip{font-size:12.5px;color:var(--pz-muted)}
.pz-slot{min-height:200px}
.pz-slot #app{height:auto;max-width:none;padding:0}
.pz-slot #app header{justify-content:flex-end}
.pz-slot #app header > div:first-child,.pz-slot #app .tabs.topic,.pz-slot #app footer,#app .ctabs{display:none!important}
.pz-slot #app .main{height:640px;min-height:0}
.pz-offline{padding:40px;text-align:center;color:var(--pz-muted);font-size:14px;background:var(--pz-soft);border-radius:12px}
/* 표지 */
.pz-cover{padding:40px 0 10px}
.pz-cover h1.pz-h1{font-size:48px;max-width:900px}
.pz-lenses{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:22px}
.pz-lens{all:unset;cursor:pointer;background:var(--pz-paper);border:1px solid var(--pz-line);border-top:5px solid var(--tc);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:8px;transition:transform .15s,box-shadow .15s}
.pz-lens:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.07)}
.pz-lens:focus-visible{outline:2px solid var(--tc);outline-offset:3px}
.pz-lens .k{font-size:12px;font-weight:700;color:var(--tc)}
.pz-lens .t{font-size:22px;font-weight:700;color:var(--pz-ink)}
.pz-lens .q{font-size:15px;color:var(--pz-ink);line-height:1.5}
.pz-lens .d{font-size:13px;color:var(--pz-muted);line-height:1.6}
.pz-lens .go{margin-top:auto;font-size:13px;font-weight:600;color:var(--tc)}
/* 공원이란 */
.pz-two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
.pz-types{display:flex;flex-direction:column;gap:10px}
.pz-type{display:grid;grid-template-columns:110px minmax(0,1fr) 46px;gap:12px;align-items:center;font-size:13.5px}
.pz-type .nm{font-weight:700}.pz-type .nm small{display:block;font-weight:400;font-size:11.5px;color:var(--pz-muted)}
.pz-type .tr{height:14px;background:var(--pz-soft);border-radius:0 4px 4px 0}
.pz-type .tr span{display:block;height:100%;background:var(--pz-ink);border-radius:0 4px 4px 0}
.pz-type .c{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.pz-years{display:flex;align-items:flex-end;gap:6px;height:170px;margin-top:8px;padding-bottom:22px;position:relative}
.pz-y{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.pz-y b{font-size:11.5px;font-variant-numeric:tabular-nums;margin-bottom:3px}
.pz-y span{width:100%;max-width:34px;border-radius:4px 4px 0 0;background:var(--pz-line)}
.pz-y.urg span{background:var(--pz-ink)}
.pz-y em{position:absolute;bottom:-20px;font-style:normal;font-size:11px;color:var(--pz-muted)}
.pz-y.empty span{height:2px!important;background:var(--pz-line)}
.pz-steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.pz-steps3 > div{background:var(--pz-soft);border-radius:12px;padding:16px}
.pz-steps3 .t{font-weight:700;font-size:15px;margin-bottom:4px}
.pz-steps3 .d{font-size:13px;line-height:1.65;color:var(--pz-muted)}
/* 아래 이동 */
.pz-nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.96);border-top:1px solid var(--pz-line);backdrop-filter:blur(6px)}
.pz-nav-in{max-width:1240px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.pz-nav button{font:inherit;font-size:14px;font-weight:600;border-radius:10px;padding:9px 18px;cursor:pointer;border:1px solid var(--pz-line);background:var(--pz-paper);color:var(--pz-ink)}
.pz-nav button.next{background:var(--pz-ink);border-color:var(--pz-ink);color:#fff}
.pz-nav button:disabled{opacity:.35;cursor:default}
.pz-nav .pos{font-size:12.5px;color:var(--pz-muted)}
.pz-src{font-size:12px;line-height:1.7;color:var(--pz-muted)}
@media (max-width:960px){
  .pz-flow,.pz-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pz-stepc:not(:last-child)::after{display:none}
  .pz-res,.pz-two,.pz-lenses,.pz-steps3{grid-template-columns:1fr}
  h1.pz-h1,.pz-cover h1.pz-h1{font-size:32px} h2.pz-h2{font-size:24px}
  .pz-dl{grid-template-columns:1fr}
  .pz-r{grid-template-columns:20px 96px minmax(0,1fr) 78px}
  .pz-slot #app .main{height:auto}
  .pz-brand{display:none}
}
@media print{.pz-top,.pz-nav{display:none}.pz-page{display:block!important;break-after:page}}
</style>

<div class="pz-top"><div class="pz-top-in">
  <div class="pz-brand">청주시 장기미집행 공원 조성 우선순위<small>2040 청주시 공원녹지기본계획</small></div>
  <nav class="pz-steps" id="pzSteps" aria-label="발표 순서"></nav>
</div></div>
<main class="pz-main" id="pzMain"></main>
<div class="pz-nav"><div class="pz-nav-in">
  <button id="pzPrev">← 이전</button><span class="pos" id="pzPos"></span><button class="next" id="pzNext">다음 →</button>
</div></div>
<div id="pzHome" hidden></div>
