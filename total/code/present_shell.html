<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 발표용 껍데기 — 지도 앱(#app)은 그대로 두고 앞뒤로 설명 페이지를 붙인다. 클래스는 모두 pz- (지도 앱 CSS와 겹치지 않게). */
:root{--pz-use:#3a7d5c; --pz-heat:#c4623a; --pz-biz:#2b6cb0; --pz-comp:#c27a12; --pz-cons:#2b6cb0;
  --pz-ink:#1a2230; --pz-ink2:#3b4556; --pz-muted:#6b7380; --pz-line:#e7e5df; --pz-soft:#f4f3ef; --pz-paper:#ffffff; --pz-bg:#f8f7f4;
  --pz-shadow:0 1px 2px rgba(26,34,48,.04),0 2px 8px rgba(26,34,48,.04);
  --f-body:"Pretendard Variable",Pretendard,"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
/* 지도 앱 색도 같은 톤으로 (밝은 화면 고정) */
:root[data-theme="light"]{--bg:#f8f7f4;--panel:#ffffff;--ink:#1a2230;--muted:#6b7380;--line:#e7e5df;--soft:#f4f3ef;--map:#eef0ec;--gu:#e6e9e3;--gu-line:#b7beb5;--accent:#2b6cb0}
body{background:var(--pz-bg);padding:0!important;margin:0;color:var(--pz-ink);font-family:var(--f-body);-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
.pz-top{position:sticky;top:0;z-index:20;background:rgba(248,247,244,.88);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--pz-line)}
.pz-top-in{max-width:1280px;margin:0 auto;padding:12px 32px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.pz-brand{font-weight:700;font-size:14px;color:var(--pz-ink);margin-right:auto;display:flex;align-items:center;gap:10px}
.pz-brand::before{content:"";width:9px;height:9px;border-radius:2px;background:linear-gradient(135deg,var(--pz-use),var(--pz-biz));transform:rotate(45deg)}
.pz-brand small{font-weight:500;font-size:12px;color:var(--pz-muted);margin-left:2px}
.pz-steps{display:flex;gap:2px;background:var(--pz-paper);border:1px solid var(--pz-line);border-radius:999px;padding:3px}
.pz-steps button{display:flex;align-items:center;gap:7px;border:0;background:transparent;color:var(--pz-muted);font:inherit;font-size:13px;font-weight:600;padding:6px 13px 6px 8px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s}
.pz-steps button i{font-style:normal;display:inline-grid;place-items:center;width:19px;height:19px;border-radius:50%;background:var(--pz-soft);font-size:10.5px;font-weight:700;color:var(--pz-muted)}
.pz-steps button[aria-current="step"]{color:#fff;background:var(--pz-ink)}
.pz-steps button[aria-current="step"] i{background:rgba(255,255,255,.18);color:#fff}
.pz-steps button:hover:not([aria-current]){color:var(--pz-ink);background:var(--pz-soft)}
.pz-main{max-width:1280px;margin:0 auto;padding:44px 32px 130px}
.pz-page{display:none}.pz-page.on{display:block;animation:pzin .45s cubic-bezier(.2,.7,.2,1)}
@keyframes pzin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pz-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:.04em;color:var(--tc,var(--pz-muted))}
.pz-eyebrow::before{content:"";width:18px;height:2px;border-radius:2px;background:currentColor}
h1.pz-h1{font-size:46px;line-height:1.18;font-weight:800;letter-spacing:-.035em;margin:14px 0 18px;color:var(--pz-ink);text-wrap:balance}
h2.pz-h2{font-size:34px;line-height:1.25;font-weight:800;letter-spacing:-.03em;margin:12px 0 4px;color:var(--pz-ink);text-wrap:balance}
h3.pz-h3{font-size:17px;font-weight:700;margin:0 0 16px;color:var(--pz-ink);display:flex;align-items:center;gap:10px;letter-spacing:-.01em}
h3.pz-h3 .n{display:inline-grid;place-items:center;width:24px;height:24px;font-size:12px;font-weight:700;color:var(--tc,var(--pz-ink));background:color-mix(in srgb,var(--tc,var(--pz-ink)) 12%,white);border-radius:7px}
.pz-lead{font-size:17.5px;line-height:1.75;color:var(--pz-ink2);max-width:780px;margin:0}
.pz-lead b{color:var(--pz-ink);font-weight:700}
.pz-block{background:var(--pz-paper);border:1px solid var(--pz-line);border-radius:18px;padding:28px 30px;margin-top:20px;box-shadow:var(--pz-shadow)}
.pz-why{position:relative;overflow:hidden;background:linear-gradient(120deg,color-mix(in srgb,var(--tc) 7%,white),#fff 60%)}
.pz-why::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tc)}
.pz-why h3.pz-h3{margin-bottom:10px}
.pz-why p{font-size:16.5px;line-height:1.8;margin:0;color:var(--pz-ink);max-width:920px}
.pz-why ul{margin:16px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px}
.pz-why li{font-size:12.5px;font-weight:500;background:#fff;border:1px solid color-mix(in srgb,var(--tc) 22%,white);color:color-mix(in srgb,var(--tc) 75%,black);border-radius:999px;padding:4px 12px}
.pz-flow{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:16px;position:relative}
.pz-stepc{position:relative;background:var(--pz-paper);border:1px solid var(--pz-line);border-radius:14px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:7px}
.pz-stepc:not(:last-child)::after{content:"";position:absolute;right:-12px;top:50%;width:8px;height:8px;border-top:1.5px solid #b9b6ad;border-right:1.5px solid #b9b6ad;transform:translateY(-50%) rotate(45deg);z-index:1}
.pz-stepc .k{font-size:12px;font-weight:700;color:var(--tc)}
.pz-stepc .t{font-size:16.5px;font-weight:700;color:var(--pz-ink);letter-spacing:-.01em}
.pz-stepc .d{font-size:13.5px;line-height:1.65;color:var(--pz-muted)}
.pz-stepc .f{font-family:var(--f-body);font-size:12.5px;font-weight:600;background:var(--pz-soft);border-radius:8px;padding:7px 10px;color:var(--pz-ink2);margin-top:auto}
.pz-stepc .s{font-size:11.5px;color:var(--pz-muted)}
.pz-stepc.key{border-color:var(--tc);box-shadow:0 0 0 3px color-mix(in srgb,var(--tc) 12%,transparent)}
.pz-stepc.key .f{background:color-mix(in srgb,var(--tc) 10%,white);color:color-mix(in srgb,var(--tc) 80%,black)}
.pz-note{margin-top:16px;font-size:13.5px;line-height:1.7;color:var(--pz-ink2);background:var(--pz-soft);border-radius:12px;padding:13px 16px}
.pz-note b{font-weight:700;color:var(--pz-ink)}
details.pz-more{margin-top:18px;border-top:1px dashed var(--pz-line);padding-top:14px}
details.pz-more summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--pz-muted);list-style:none;display:inline-flex;align-items:center;gap:7px;user-select:none}
details.pz-more summary::-webkit-details-marker{display:none}
details.pz-more summary::before{content:"";width:7px;height:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .2s;margin-right:2px}
details.pz-more[open] summary::before{transform:rotate(45deg)}
details.pz-more summary:hover{color:var(--pz-ink)}
.pz-dl{display:grid;grid-template-columns:200px 1fr;gap:10px 20px;margin-top:14px;font-size:13px;line-height:1.65}
.pz-dl dt{color:var(--pz-muted);font-weight:600}.pz-dl dd{margin:0;color:var(--pz-ink2)}
.pz-kpis{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:14px}
.pz-kpi{background:var(--pz-paper);border:1px solid var(--pz-line);border-radius:14px;padding:18px 20px}
.pz-kpi .l{font-size:12.5px;color:var(--pz-muted);font-weight:600}
.pz-kpi .v{font-size:32px;font-weight:800;letter-spacing:-.03em;color:var(--pz-ink);margin-top:6px;font-variant-numeric:tabular-nums;line-height:1.1}
.pz-kpi .v small{font-size:15px;font-weight:600;color:var(--pz-muted);margin-left:3px;letter-spacing:0}
.pz-kpi .c{font-size:12px;color:var(--pz-muted);margin-top:6px;line-height:1.5}
.pz-kpi.hl{background:color-mix(in srgb,var(--tc) 7%,white);border-color:color-mix(in srgb,var(--tc) 30%,white)}
.pz-kpi.hl .v{color:color-mix(in srgb,var(--tc) 85%,black)}
.pz-res{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;margin-top:26px;align-items:start}
.pz-sub{font-size:14.5px;font-weight:700;color:var(--pz-ink);margin:0 0 4px}
.pz-cap{font-size:12.5px;color:var(--pz-muted);margin:0 0 14px;line-height:1.6}
.pz-rank{display:flex;flex-direction:column;gap:12px}
.pz-r{display:grid;grid-template-columns:20px 120px minmax(0,1fr) 118px;align-items:center;gap:12px;font-size:13.5px}
.pz-r .no{font-weight:700;color:#a6a39a;font-variant-numeric:tabular-nums}
.pz-r .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pz-r .nm small{display:block;font-weight:400;font-size:11.5px;color:var(--pz-muted)}
.pz-r .tr{height:10px;background:var(--pz-soft);border-radius:0 5px 5px 0;display:flex;gap:2px}
.pz-r .tr span{display:block;height:100%}
.pz-r .tr span:last-child{border-radius:0 5px 5px 0}
.pz-r .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.pz-r .val small{display:block;font-size:11px;font-weight:400;color:var(--pz-muted)}
.pz-legend{display:flex;gap:16px;font-size:12px;color:var(--pz-muted);margin:-2px 0 14px}
.pz-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.pz-take{align-self:start;background:color-mix(in srgb,var(--tc) 6%,white);border:1px solid color-mix(in srgb,var(--tc) 22%,white);border-radius:16px;padding:22px 24px;display:flex;flex-direction:column;gap:12px}
.pz-take .h{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--tc)}
.pz-take p{margin:0;font-size:16.5px;line-height:1.75;color:var(--pz-ink)}
.pz-take p b{font-weight:800;color:color-mix(in srgb,var(--tc) 85%,black)}
.pz-take ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.75;color:var(--pz-ink2)}
.pz-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.pz-chips span{font-size:12px;background:#fff;border:1px solid color-mix(in srgb,var(--tc) 22%,white);border-radius:999px;padding:2px 10px;color:var(--pz-ink2)}
table.pz-t{width:100%;border-collapse:collapse;margin-top:14px;font-size:12.5px}
table.pz-t th{text-align:left;color:var(--pz-muted);font-weight:600;border-bottom:1px solid var(--pz-ink);padding:7px 8px;white-space:nowrap}
table.pz-t td{border-bottom:1px solid var(--pz-line);padding:7px 8px;font-variant-numeric:tabular-nums}
table.pz-t td.r,table.pz-t th.r{text-align:right}
table.pz-t tr:hover td{background:var(--pz-soft)}
.pz-dash-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.pz-dash-head .tip{font-size:12.5px;color:var(--pz-muted)}
.pz-slot{min-height:200px}
/* 지도: 가로형(16:10), 오른쪽 패널은 지도 높이에 맞추고 안에서 스크롤 */
.pz-slot #app{height:auto;max-width:none;padding:0;gap:10px}
.pz-slot #app header{justify-content:flex-end}
.pz-slot #app header > div:first-child,.pz-slot #app .tabs.topic,.pz-slot #app footer,#app .ctabs{display:none!important}
.pz-slot #app .main{height:auto;min-height:0;grid-template-columns:minmax(0,1fr) 330px;align-items:stretch}
.pz-slot #app .mapbox{aspect-ratio:16/10;min-height:0;border-radius:14px;border-color:var(--pz-line)}
.pz-slot #app aside{height:0;min-height:100%;border-radius:14px;border-color:var(--pz-line)}
.pz-slot #app .chartview{max-height:720px;border-radius:14px}
.pz-slot #app .tabs{background:var(--pz-soft)}
.pz-slot #app .ctrl label,.pz-slot #app .seg,.pz-slot #app .legend,.pz-slot #app .hint{border-color:var(--pz-line);box-shadow:var(--pz-shadow);backdrop-filter:blur(6px)}
.pz-slot #app .legend{background:rgba(255,255,255,.94)}
.pz-offline{padding:40px;text-align:center;color:var(--pz-muted);font-size:14px;background:var(--pz-soft);border-radius:12px}
/* 표지 */
.pz-hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:40px;align-items:center;padding:12px 0 6px}
.pz-hero h1.pz-h1{font-size:52px}
.pz-cmap{background:var(--pz-paper);border:1px solid var(--pz-line);border-radius:22px;padding:18px;box-shadow:var(--pz-shadow)}
.pz-cmap svg{display:block;width:100%;height:auto}
.pz-cmap .lg{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--pz-muted);margin-top:6px}
.pz-cmap .lg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.pz-lenses{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px}
.pz-lens{all:unset;cursor:pointer;background:var(--pz-paper);border:1px solid var(--pz-line);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:8px;transition:transform .2s,box-shadow .2s,border-color .2s;box-shadow:var(--pz-shadow);position:relative;overflow:hidden}
.pz-lens::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--tc)}
.pz-lens:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(26,34,48,.08);border-color:color-mix(in srgb,var(--tc) 35%,white)}
.pz-lens:focus-visible{outline:2px solid var(--tc);outline-offset:3px}
.pz-lens .k{font-size:12px;font-weight:700;color:var(--tc)}
.pz-lens .t{font-size:24px;font-weight:800;color:var(--pz-ink);letter-spacing:-.02em}
.pz-lens .q{font-size:15px;font-weight:600;color:var(--pz-ink2);line-height:1.5}
.pz-lens .d{font-size:13.5px;color:var(--pz-muted);line-height:1.65}
.pz-lens .go{margin-top:auto;padding-top:6px;font-size:13px;font-weight:700;color:var(--tc)}
.pz-lens .m{font-size:12px;font-weight:600;color:var(--pz-ink2);background:var(--pz-soft);border-radius:8px;padding:6px 10px;margin-top:4px}
.pz-order{gap:28px;margin-top:26px}
.pz-order .pz-lens{overflow:visible}
.pz-order .pz-lens:not(:last-child)::after{content:"";position:absolute;right:-19px;top:50%;width:9px;height:9px;border-top:2px solid #b9b6ad;border-right:2px solid #b9b6ad;transform:translateY(-50%) rotate(45deg)}
.pz-order .pz-lens::before{border-radius:18px 18px 0 0}
.pz-why3 .t{display:flex;align-items:center;gap:9px}
.pz-why3 .t span{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--tc);color:#fff;font-size:12px;font-weight:700}
.pz-why3 > div{border-top:3px solid var(--tc)}
.pz-why3 .d b{color:var(--pz-ink)}
/* 공원이란 */
.pz-divider{margin-top:64px;padding-top:36px;border-top:1px solid var(--pz-line)}
.pz-divider .pz-h2{margin-bottom:12px}
.pz-two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.pz-two > .pz-block{margin-top:20px}
.pz-types{display:flex;flex-direction:column;gap:12px}
.pz-type{display:grid;grid-template-columns:110px minmax(0,1fr) 46px;gap:12px;align-items:center;font-size:13.5px}
.pz-type .nm{font-weight:700}.pz-type .nm small{display:block;font-weight:400;font-size:11.5px;color:var(--pz-muted)}
.pz-type .tr{height:10px;background:var(--pz-soft);border-radius:0 5px 5px 0}
.pz-type .tr span{display:block;height:100%;background:var(--pz-ink2);border-radius:0 5px 5px 0}
.pz-type .c{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.pz-years{display:flex;align-items:flex-end;gap:6px;height:170px;margin-top:8px;padding-bottom:22px;position:relative;border-bottom:1px solid var(--pz-line)}
.pz-y{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.pz-y b{font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;margin-bottom:4px;color:var(--pz-ink2)}
.pz-y span{width:100%;max-width:30px;border-radius:5px 5px 0 0;background:#d9d6ce}
.pz-y.urg span{background:var(--pz-ink2)}
.pz-y em{position:absolute;bottom:-21px;font-style:normal;font-size:11px;color:var(--pz-muted)}
.pz-y.empty span{height:0!important}
.pz-steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.pz-steps3 > div{background:var(--pz-soft);border-radius:14px;padding:18px}
.pz-steps3 .t{font-weight:700;font-size:15px;margin-bottom:6px;color:var(--pz-ink)}
.pz-steps3 .d{font-size:13.5px;line-height:1.7;color:var(--pz-muted)}
/* 아래 이동 */
.pz-nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(248,247,244,.9);border-top:1px solid var(--pz-line);backdrop-filter:saturate(1.4) blur(10px)}
.pz-nav-in{max-width:1280px;margin:0 auto;padding:12px 32px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.pz-nav button{font:inherit;font-size:14px;font-weight:600;border-radius:999px;padding:9px 20px;cursor:pointer;border:1px solid var(--pz-line);background:var(--pz-paper);color:var(--pz-ink);transition:background .2s}
.pz-nav button:hover:not(:disabled){background:var(--pz-soft)}
.pz-nav button.next{background:var(--pz-ink);border-color:var(--pz-ink);color:#fff}
.pz-nav button.next:hover:not(:disabled){background:#2c3748}
.pz-nav button:disabled{opacity:.35;cursor:default}
.pz-nav .pos{font-size:12.5px;color:var(--pz-muted);font-variant-numeric:tabular-nums}
.pz-src{font-size:12px;line-height:1.75;color:var(--pz-muted)}
@media (max-width:960px){
  .pz-order .pz-lens::after{display:none}
  .pz-flow,.pz-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pz-stepc:not(:last-child)::after{display:none}
  .pz-res,.pz-two,.pz-lenses,.pz-steps3,.pz-hero{grid-template-columns:1fr}
  h1.pz-h1,.pz-hero h1.pz-h1{font-size:34px} h2.pz-h2{font-size:26px}
  .pz-dl{grid-template-columns:1fr}
  .pz-r{grid-template-columns:18px 96px minmax(0,1fr) 92px}
  .pz-slot #app .main{grid-template-columns:1fr}
  .pz-slot #app .mapbox{aspect-ratio:4/3}
  .pz-slot #app aside{height:auto;min-height:0;max-height:420px}
  .pz-brand{display:none} .pz-main,.pz-top-in,.pz-nav-in{padding-left:16px;padding-right:16px}
}
@media print{.pz-top,.pz-nav{display:none}.pz-page{display:block!important;break-after:page}}
</style>

<div class="pz-top"><div class="pz-top-in">
  <div class="pz-brand">청주시 장기미집행 공원 조성 우선순위<small>2040 공원녹지기본계획</small></div>

</div></div>

</div></div>
