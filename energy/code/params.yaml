# 에너지(열저감) 파트 상수 — 코드에는 숫자를 쓰지 않고 이 파일만 읽는다. 근거 번호 = evidence/evidence_E_energy.md
# 질문: 공원을 조성하면(지금 상태 대비) 공원과 주변의 여름 지표온도가 얼마나 내려가나?
# 원칙: 계수는 모두 청주 위성 실측에서 구한다(문헌 계수 0개). 전력(kWh)으로는 바꾸지 않는다(E5: 근거 부족).
# 비교 기준은 "조성 vs 지금 그대로". 개발 압력·비용은 다루지 않는다(필요성·사업성 파트 몫).

gee:                               # 두 GEE 스크립트 공통 설정 (make_gee_script.py가 넣음)
  project: cheongju-grpi           # 비상업(학술) 등록 Cloud 프로젝트
  aoi: [127.38, 36.56, 127.56, 36.70]   # 청주 시가지 사각형
  months: [6, 9]                   # 여름 6~9월
  landsat: {start: "2021-01-01", end: "2025-12-31", max_cloud: 40}   # 1차 실행(공간 비교 계수, 참고용)
  sentinel2: {start: "2024-01-01", end: "2025-12-31", max_cloud: 30, scl_bad: [3, 8, 9, 10]}  # 공원별 지금 녹지 (10m)
  worldcover: {water: 80, tree: 10, grass: 30, built: 50}   # ESA WorldCover v200 분류 번호
  ghsl_year: "2020"                # GHSL 인구 기준연도
  rings_m: [120, 300]              # 1차 실행에서 뽑아 둔 주변 고리 인구
  scale_m: {landsat: 30, s2: 10, s2_city: 20, ghsl: 100, scene_mean: 300}
  landsat_scale: {sr_mult: 0.0000275, sr_add: -0.2, st_mult: 0.00341802, st_add: 149.0, kelvin: 273.15}   # USGS C2 L2 환산식
  landsat_qa_bits: [1, 3, 4, 5]    # QA_PIXEL: 1 팽창 구름, 3 구름, 4 그림자, 5 눈

change:                            # 2차 실행: 녹지가 실제로 변한 곳의 온도 변화 (E1과 같은 두 시기)
  before: ["2013-04-01", "2016-10-01"]
  after: ["2023-04-01", "2025-10-01"]
  min_change: 0.1                  # NDVI가 0.1 이상 변한 픽셀만 (잡음 제외)
  ring_m: 300                      # 주변 고리 폭 (E1 실측과 같은 폭)

coef:                              # NDVI 1 변화당 지표온도 변화(°C) — 2차 실행 결과에서 고른다
  low: green                       # 하한 = 녹지가 늘어난 픽셀들의 기울기
  high: loss                       # 상한 = 녹지가 줄어든 픽셀들의 기울기 (숲→개발)

target_ndvi:                       # 조성 후 녹지 수준 (Sentinel-2 여름 NDVI, 청주 시가지 같은 땅덮개 중앙값, 1차 실행)
  low: grass                       # 잔디·초지 수준 (WorldCover 30)
  high: tree                       # 수목 수준 (WorldCover 10)
ndvi_gain_floor: 0                 # 지금이 목표보다 녹지가 많으면 개선 0
park_kind: "보전형 = 지금 NDVI가 잔디 수준 이상(이미 녹지) / 조성형 = 그 미만(녹지를 새로 만듦)"

thermal_cell_m2: 10000             # Landsat 열밴드 원래 해상도 100m → 위성이 온도를 구분하는 최소 칸 1ha (E3)
spillover:                         # 공원 안 변화 중 주변 300m로 퍼지는 비율 (E1 실측)
  source_file: tukrye_before_after.json
  sites: [잠두봉, 매봉]            # 위치 검증 "양호" 두 곳 → 하한·상한
  min_park_m2: 10000               # 실측한 개발지(3~15ha)와 규모가 비슷한 1ha 이상 공원에만 적용

boundary_ok: [일치]                # biz/data/vworld/land_own.csv 경계 매칭이 이 값이 아니면 비고에 표시
excluded_types: [생태공원]         # 사업성 파트와 같은 제외
excluded_note: "생태공원(하천·제방 위주) — 수면이 NDVI를 낮춰 녹지 증가가 과대 계산되므로 미산정"

grade:                             # 등급 = 시나리오마다 냉각량(°C·ha) 순위 (산정 공원 수 기준 상위 비율)
  top_share: 0.25                  # 상 = 상위 25%
  mid_share: 0.5                   # 중 = 50%까지, 나머지 하
units: {m2_per_ha: 10000}
coord_scale: 100000                # biz/data/vworld/*.txt 좌표 = 경위도 × 1e5 정수 (biz/code/build_mapdata.py 형식)
