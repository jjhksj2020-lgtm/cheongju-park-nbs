# E·D·C 기준값 — 코드에 숫자를 쓰지 않고 여기서만 읽는다. 버퍼 반경은 need/presets.yaml buffer_m.
vulnerable_age: {old_min: 65, young_max: 9}          # 중간보고서 2-3 (가) E2: 65세 이상 + 9세 이하
service_radius_m:                                     # 도시공원법 시행규칙 [별표 3] 유치거리 (D1 기존 공원 서비스권)
  어린이공원: 250
  근린공원: 500          # 근린생활권 근린공원. 도보권(1km)·도시지역권(제한 없음) 구분 자료가 없어 보수적으로 500m
  소공원: 250            # 별표3 제한 없음 → 어린이공원과 같은 값으로 가정(tag: 가정)
  default: 500
c1_near_m: 500                                        # C1_near 플래그 경계 (가정 — 팀 합의 필요)
river_adjacent_m: 100                                 # river_adjacent 플래그: 하천(river·stream) 100m 이내 (가정)
small_park_m2: 1500                                   # OSM 공원 중 이름에 유형이 없으면 이 면적 미만은 소공원(250m)으로 본다 (가정)
# C1 녹지·수변축 — 제안서 [1] p.9: 수변생태축 = 미호천·무심천·달천·석남·가경천·금천 (+2040 금강), 녹지축 = 내·외부 산악·도시내부 동서·남서
axis_rivers: [미호강, 미호천, 무심천, 달천, 석남천, 가경천, 금천천, 금강]   # 가경천은 OSM에 없음
axis_forest_min_ha: 50                                # 녹지축 대리: 50ha 이상 산림 덩어리 (가정 — 도면 원본 수령 시 교체)

