# E·D·C 기준값 — 코드에 숫자를 쓰지 않고 여기서만 읽는다. 버퍼 반경은 need/presets.yaml buffer_m.
vulnerable_age: {old_min: 65, young_max: 9}          # 중간보고서 2-3 (가) E2: 65세 이상 + 9세 이하
service_radius_m:                                     # 도시공원법 시행규칙 [별표 3] 유치거리 (D1 기존 공원 서비스권)
  어린이공원: 250
  근린공원: 500          # 근린생활권 근린공원. 도보권(1km)·도시지역권(제한 없음) 구분 자료가 없어 보수적으로 500m
  소공원: 250            # 별표3 제한 없음 → 어린이공원과 같은 값으로 가정(tag: 가정)
  default: 500
c1_near_m: 500                                        # C1_near 플래그 경계 (가정 — 팀 합의 필요)
river_adjacent_m: 100                                 # river_adjacent 플래그: 하천(river·stream) 100m 이내 (가정)
small_park_m2: 1500                                   # OSM 공원 중 이름에 유형이 없으면 이 면적 미만은 소공원(250m)으로 본다 (가정)
# C1 녹지·수변축 — 제안서 [1] p.9: 수변생태축 = 미호천·무심천·달천·석남·가경천·금천 (+2040 금강), 녹지축 = 내·외부 산악·도시내부 동서·남서
axis_rivers: [미호강, 미호천, 무심천, 달천, 석남천, 가경천, 금천천, 금강]   # 가경천은 OSM에 없음
# D2 — 2030 청주시 공원녹지기본계획(2020) <표 11-2> 생활권별 공원현황 (2040 청주도시기본계획 제11장 p.421 재인용)
#      1인당 조성면적(㎡/인, 2019 인구). 결정면적 기준은 per_cap_decided.
living_zone_park:
  source: "2030 청주시 공원녹지기본계획(2020) 표11-2, cheongju.go.kr/www/download/cts17053_n12.pdf p.421"
  per_cap_built:   {도심생활권: 1.7, 상당생활권: 6.0, 서원생활권: 2.6, 흥덕생활권: 5.2, 청원생활권: 7.4}
  per_cap_decided: {도심생활권: 11.1, 상당생활권: 18.8, 서원생활권: 15.2, 흥덕생활권: 24.1, 청원생활권: 15.1}
# 생활권 배정: 도심생활권 동 목록은 청주형 15분 도시 일상생활권 구축계획(1차, 2025) 보도 기준(가정 — 2030 계획 원문 동 목록 미확인). 나머지는 구 = 생활권.
downtown_dongs: [중앙동, 성안동, 탑대성동, 사직1동, 사직2동, 사창동, 운천신봉동, 우암동]
axis_forest_min_ha: 300                              # 녹지축 대리: 300ha 이상 큰 산림(내·외부 산악축) (가정 — 도면 원본 수령 시 교체). 50ha로는 28/39곳이 500m 안이라 변별력 없음
# 지역 유형 — 표시·필터용, 점수에 넣지 않음(용도지역은 개발압력 P2와 겹침). 버퍼 기준, 모두 가정
area_type:
  dense_per_km2: 10000      # 밀집: 버퍼 인구밀도 1만 명/㎢ 이상
  residential_per_km2: 1500 # 주거: 1,500명/㎢ 이상 또는 OSM 주거용지 비율 ≥ residential_share
  residential_share: 0.15
  industrial_share: 0.10    # 산업: OSM 산업용지 비율 ≥ 10% (밀집·주거와 겹치면 함께 표기)
  # 어느 것에도 해당하지 않으면 기타(농촌·산림). OSM 주거용지는 도심에서 누락이 많아 밀도를 우선한다

# 인구 격자 — E1·E2·D1·지역 유형이 함께 쓴다. sgis(2024 등록센서스 100m, 실자료) | worldpop(2020, 대체자료·비교용)
pop_source: sgis
sgis_grid:
  file: sgis/sgis_grid_pop_2024_100m.zip   # SGIS 자료제공 신청(2026-11-18), 격자통계(인구) 2024 100M, 격자 다바·라바
  item_total: to_in_001                    # 총인구 (to_in_007·008은 성별)
  crs: "EPSG:5179"                          # 격자 경계 shp의 prj (Korea 2000 UTM-K)
  cell_m: 100
  # 격자 코드 = 100km 칸 글자 2자 + x 3자리 + y 3자리(100m 단위). 칸 왼쪽 아래 좌표 (shp 경계와 대조해 확인)
  x0: {다: 900000, 라: 1000000}
  y0: {바: 1800000}
# 토지피복지도 — 환경부 환경공간정보서비스(EGIS) 중분류 2025(항공사진 2024-12-31), 1:25,000 도엽 14장(청주 100% 포함)
# source: egis면 C1 녹지축 산림·지역 유형을 이 자료로, osm이면 예전 OSM으로 계산한다. 수변축 하천 이름·하천 인접은 계속 OSM.
landcover:
  source: egis
  dir: egis
  forest: [310, 320, 330]      # 활엽수림·침엽수림·혼효림
  residential: [110]           # 주거지역
  industrial: [120]            # 공업지역
  commercial: [130]            # 상업지역
# D1 기존 공원 — city: 청주시 도시공원정보(2025-11-20) − 미조성공원 현황(2026-09-29, '미조성'만 제외, 부분조성은 기존으로 봄)
#   좌표가 주소의 구 밖이면 V-World 주소 검색 좌표(geocoded_vworld.csv), 그래도 없으면 OSM 같은 이름. 점 위치라 면적이 같은 원으로 본다(가정)
#   유치거리는 공원구분으로 service_radius_m 을 고른다(수변·역사·체육·문화·묘지·기타는 default). osm: 예전 OSM 공원·놀이터
existing_parks_source: city

# ---------- 우선순위 시험판 (build_priority.py) ----------
# 계수는 모두 정진형 R1·R1-h 실측(전국 Landsat 8/9 여름 지표온도, 사례 안 대비 = 구역 − 300~500m 고리, 중앙값)을 그대로 옮긴 것.
# 출처: 본 연구 분석(팀 내부, 미발표) — 정진형/08_R1_조성사례_실측.md §3-2·3-5·3-7, 정진형/09_반사실_사례데이터.md §2, 정진형/data/r3_did_summary.txt. 원자료 문헌은 references.yaml
priority:
  profile_csv: 정진형/data/r1_profile40.csv           # 40곳 유형(조성형/보전형) + 현재 경계 밖 시가지 온도 프로필 (R1-f)
  landcover_groups:                                   # 토지피복지도 2025 중분류 → 묶음 (공원 안 비율)
    시가지: [110, 120, 130, 140, 150, 160]
    농업: [210, 220, 230, 240, 250]
    산림: [310, 320, 330]
    초지: [410, 420]
    습지: [510]
    나지: [610, 620]
    수역: [710]
  restorable: [시가지, 농업, 나지]                     # 녹화 여지가 있는 땅(복원 가능 면적) — 산림·초지·습지·수역은 이미 녹지·물 (가정)
  # 냉각(또는 개발 시 상승)이 닿는 범위: 08 §3-7 제안 — 1ha 미만 30~50m, 1~5ha 100~200m, 5~10ha 숲 300m, 100ha 이상 600m 이상
  range_by_ha: [[0, 50], [1, 200], [5, 300], [100, 600]]   # [이 면적(ha) 이상이면, 범위 m]
  # 거리 구간별 지표온도 변화(°C). bands = [[구간 끝 m, 변화]]. 범위 안 구간만 쓴다. 음수 = 시원해짐
  build:                                              # 조성형: 나대지·농지 → 공원 (R1, 72곳)
    lt04: {in: null, bands: [[100, -0.3]], note: "0.4ha 미만은 위성으로 못 봄 → 경계 밖 −0.3°C를 상한으로 가정(근거 문헌 원문 미확인, 2026-11-26 확인 결과 인용 논문 초록에 이 수치 없음)"}
    "04_06": {in: -0.78, bands: [[100, -0.43]], note: "본 연구 분석 — 전국 신규 공원 조성 전후(0.4~0.6ha 25곳) 중앙값"}
    "06_1": {in: -0.54, bands: [[100, -0.32]], note: "본 연구 분석 — 전국 신규 공원 조성 전후(0.6~1ha 15곳) 중앙값"}
    ge1: {in: -1.46, bands: [[100, -0.67], [200, -0.10]], note: "본 연구 분석 — 전국 신규 공원 조성 전후(1ha 이상 28곳) 중앙값"}
  keep:                                               # 보전형: 숲이 개발되면 (R1-h, 전국 도시 숲 일부 개발 561곳) → 공원으로 지키면 피하는 상승
    in: 4.56
    bands: [[100, 1.99], [200, 0.41], [300, 0.13]]
    note: "본 연구 분석 — 전국 도시 숲 일부 개발 561곳 전후 중앙값(개발부 2~20ha). 1ha 미만 공원에 쓰면 상한"
  emission_factor_t_per_mwh: 0.4173                   # 2023 전력 배출계수 tCO2eq/MWh (정진형/README R5)

# ---------- 열 핫스팟 (build_hotspot_gee.py → GEE → build_hotspot.py) ----------
# 방법: 인천 녹지 취약지 대시보드 핫스팟 로직(②③④, 팀 공유 요약 문서)을 청주 40곳에 맞게 옮김. 기준값은 그 문서 값 그대로(가정 — 청주 검증 전)
hotspot:
  years: [2020, 2024]            # 여름 연도별 중앙값 → 5년 평균
  months: [6, 9]
  cloud_max: 40                  # Landsat 장면 구름 비율 상한(%) — 정진형 R1-f와 같음
  ndvi_ref: 0.60                 # 취약도 = (ndvi_ref − NDVI) / ndvi_span
  ndvi_span: 0.40
  lst_ref: 28                    # + (LST − lst_ref) / lst_span  (°C, 지표온도)
  lst_span: 12
  urban_dw: [6, 7]               # Dynamic World 5년 최빈 분류: 6 건물, 7 나지 → 시가지
  percentiles: [70, 80, 90]      # 시가지 안 상위 30/20/10% → 등급 1/2/3
  sample_buffer_m: 150           # 공원 경계 + 150m 안에서 핫스팟 비율을 잰다
  # 공원 핫스팟 등급 = 경계+150m 면적 중 픽셀 등급 2·3(시가지 상위 20%) 비율. 시가지 전체에서 이 비율은 정의상 20%이므로
  #   0 초과 → 1, 0.20 이상(시 평균 이상) → 2, 0.40 이상(평균의 2배) → 3. 인천 규칙(최고 1칸)은 1~2% 만으로도 등급 2·3이 되어 바꿈(2026-11-26, 가정)
  hot_share_levels: [0.20, 0.40]
  scale_m: 30
  drive_folder: cheongju_hotspot # GEE 결과를 내보낼 Google Drive 폴더
  gap_levels: [0.3, 0.6]         # 공원 공백 등급: D1(서비스권 밖 인구 비율) ≥0.3 → 1, ≥0.6 → 2 (가정)
  top: {grade_min: 2, gap_min: 2}   # 인천 topSites 규칙(핫스팟 ≥2 ∧ 공백 ≥2) — 민감도 비교용으로만 계산
  # 2축 보기: 가로 = 핫스팟 면적 비율(기준선 hot_share_levels[0] = 시 평균), 세로 = D1 서비스권 밖 비율(기준선 gap_levels[1])
  sensitivity_shares: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30]   # 핫스팟 비율 기준을 바꿔 가며 '핫스팟 ∧ 공백 2등급' 공원 수를 본다
  park_std_m2_per_cap: 6         # 생활권 공원 부족도 기준: 도시공원 및 녹지 등에 관한 법률 시행규칙 제4조 1인당 6㎡
