# E·D·C 기준값 — 코드에 숫자를 쓰지 않고 여기서만 읽는다. 버퍼 반경은 need/presets.yaml buffer_m.
vulnerable_age: {old_min: 65, young_max: 9}          # 중간보고서 2-3 (가) E2: 65세 이상 + 9세 이하
service_radius_m:                                     # 도시공원법 시행규칙 [별표 3] 유치거리 (D1 기존 공원 서비스권)
  어린이공원: 250
  근린공원: 500          # 근린생활권 근린공원. 도보권(1km)·도시지역권(제한 없음) 구분 자료가 없어 보수적으로 500m
  소공원: 250            # 별표3 제한 없음 → 어린이공원과 같은 값으로 가정(tag: 가정)
  default: 500
c1_near_m: 500                                        # C1_near 플래그 경계 (가정 — 팀 합의 필요)
river_adjacent_m: 100                                 # river_adjacent 플래그: 하천(river·stream) 100m 이내 (가정)
small_park_m2: 1500                                   # OSM 공원 중 이름에 유형이 없으면 이 면적 미만은 소공원(250m)으로 본다 (가정)
# C1 녹지·수변축 — 제안서 [1] p.9: 수변생태축 = 미호천·무심천·달천·석남·가경천·금천 (+2040 금강), 녹지축 = 내·외부 산악·도시내부 동서·남서
axis_rivers: [미호강, 미호천, 무심천, 달천, 석남천, 가경천, 금천천, 금강]   # 가경천은 OSM에 없음
# D2 — 2030 청주시 공원녹지기본계획(2020) <표 11-2> 생활권별 공원현황 (2040 청주도시기본계획 제11장 p.421 재인용)
#      1인당 조성면적(㎡/인, 2019 인구). 결정면적 기준은 per_cap_decided.
living_zone_park:
  source: "2030 청주시 공원녹지기본계획(2020) 표11-2, cheongju.go.kr/www/download/cts17053_n12.pdf p.421"
  per_cap_built:   {도심생활권: 1.7, 상당생활권: 6.0, 서원생활권: 2.6, 흥덕생활권: 5.2, 청원생활권: 7.4}
  per_cap_decided: {도심생활권: 11.1, 상당생활권: 18.8, 서원생활권: 15.2, 흥덕생활권: 24.1, 청원생활권: 15.1}
# 생활권 배정: 도심생활권 동 목록은 청주형 15분 도시 일상생활권 구축계획(1차, 2025) 보도 기준(가정 — 2030 계획 원문 동 목록 미확인). 나머지는 구 = 생활권.
downtown_dongs: [중앙동, 성안동, 탑대성동, 사직1동, 사직2동, 사창동, 운천신봉동, 우암동]
axis_forest_min_ha: 300                              # 녹지축 대리: 300ha 이상 큰 산림(내·외부 산악축) (가정 — 도면 원본 수령 시 교체). 50ha로는 28/39곳이 500m 안이라 변별력 없음
# 지역 유형 — 표시·필터용, 점수에 넣지 않음(용도지역은 개발압력 P2와 겹침). 버퍼 기준, 모두 가정
area_type:
  dense_per_km2: 10000      # 밀집: 버퍼 인구밀도 1만 명/㎢ 이상
  residential_per_km2: 1500 # 주거: 1,500명/㎢ 이상 또는 OSM 주거용지 비율 ≥ residential_share
  residential_share: 0.15
  industrial_share: 0.10    # 산업: OSM 산업용지 비율 ≥ 10% (밀집·주거와 겹치면 함께 표기)
  # 어느 것에도 해당하지 않으면 기타(농촌·산림). OSM 주거용지는 도심에서 누락이 많아 밀도를 우선한다

# 인구 격자 — E1·E2·D1·지역 유형이 함께 쓴다. sgis(2024 등록센서스 100m, 실자료) | worldpop(2020, 대체자료·비교용)
pop_source: sgis
sgis_grid:
  file: sgis/sgis_grid_pop_2024_100m.zip   # SGIS 자료제공 신청(2026-11-18), 격자통계(인구) 2024 100M, 격자 다바·라바
  item_total: to_in_001                    # 총인구 (to_in_007·008은 성별)
  crs: "EPSG:5179"                          # 격자 경계 shp의 prj (Korea 2000 UTM-K)
  cell_m: 100
  # 격자 코드 = 100km 칸 글자 2자 + x 3자리 + y 3자리(100m 단위). 칸 왼쪽 아래 좌표 (shp 경계와 대조해 확인)
  x0: {다: 900000, 라: 1000000}
  y0: {바: 1800000}
