# 필요성 · S 회복력(에너지 자립) 기준값 — 코드의 숫자 상수는 모두 여기서 온다. tag: 실자료 / 가정
# 질문: 재난 시 공원을 대피 거점으로 쓸 때, 공원 안 태양광(+ESS)이 대피 인원의 필수 전력을 얼마나 감당하나?

pv_area:                                   # 태양광 설치 가능 면적 = 공원면적 × 시설부지 상한 × PV 가능 비율 × (1 − 수목 비율)
  facility_share:                          # 공원시설 부지면적 상한 (도시공원 및 녹지 등에 관한 법률 시행규칙 별표 4) · 실자료
    소공원: 0.20
    어린이공원: 0.60
    근린공원: 0.40
    역사공원: 0.40                         # 주제공원은 별표 4에 상한이 없어 근린공원 값 적용 · 가정
    문화공원: 0.40                         # 가정
    생태공원: 0.10                         # 하천·제방 위주, 보전 우선 · 가정
  pv_share_of_facility:                    # 시설부지 중 PV를 얹을 수 있는 구조물(파고라·주차장 캐노피·관리동·화장실 지붕) 비율 · 가정
    소공원: 0.15                           # 파고라·벤치 캐노피 정도
    어린이공원: 0.10                       # 시설부지 대부분이 놀이시설·광장 (지붕 없음)
    근린공원: 0.25                         # 주차장 캐노피·관리동·광장 캐노피
    역사공원: 0.20
    문화공원: 0.20
    생태공원: 0.10
  slope_limit_deg: 15                      # 평균 경사가 이보다 크면 구조물 부지 절반만 가능 (절토 제약) · 가정
  slope_penalty: 0.5
  cap_kw: 500                              # 공원 1곳 상한 (분산전원 소규모 접속 기준, 500kW 이하) · 가정
  kw_per_m2: 0.15                          # 캐노피·지붕형: 모듈 0.20kW/㎡ × 덮는 비율 0.75 · 가정. 중간보고서 S1의 0.11(지상 이격형)은 민감도 하한
  kw_per_m2_sensitivity: [0.11, 0.18]

yield:
  base_kwh_per_kw: 1300                    # 청주 연간 발전량 (중간보고서 S1과 같은 값, 남향 30° 기준) · 실자료
  ghi_ref_kwh_m2: 1463                     # ERA5-Land 2024 청주 평균 하향단파복사; 공원별 ghi / 이 값으로 보정 · 실자료
  terrain_shadow: 0.0                      # 지형 지평선 그늘 손실. GEE hillShadow(동지 09·12·15시, 3km)로 40곳 모두 그늘 0 확인 → 0 · 실자료
  building_shade_loss_per_m: 0.01          # 주변 300m 평균 건물높이 1m당 손실 (예: 28m → 28%) · 가정
  building_shade_loss_max: 0.35
  pr: 0.80                                 # 성능비 (인버터·온도·오염) · 실자료(통상값)
  worst_month_factor: 0.70                 # 재난 시 보수적 일 발전량 = 연평균 일 발전량 × 이 값. ERA5 2022-24 청주 12월 GHI/월평균 = 0.58, 남향 30° 경사면은 겨울 이득(1.35/1.10)으로 ≈0.71 · 실자료+가정

evacuation:
  radius_m: 2000                           # 피난 수요 집계 반경 (황지루이·이애란 2020, 율봉공원) · 실자료
  evac_rate: 0.30                          # 피난율 30% · 실자료 (같은 논문)
  m2_per_person: 2.0                       # 옥외 대피 수용 2㎡/인 · 실자료 (같은 논문)
  load_kwh_per_person_day: 0.05            # 1인 1일 필수 전력(조명·통신·휴대폰 충전). 일본 경산성 시산: 500명 체육관 대피소 20kWh/일(0.04), 1,000명 50kWh/일(0.05) · 실자료(해외)
  load_sensitivity: [0.03, 0.15]           # 하한 = LED 조명+충전만, 상한 = 환기·냉장·급수펌프 추가
  autonomy_days: 2                         # ESS 자립 일수. 도요하시시 연구: 일부하의 1.75~2일분 · 실자료(해외)

score:
  weights: {self_sufficiency: 0.4, covered_persons: 0.6}   # S = 자립률(1.0 상한) 백분위 × 0.4 + 전력 보장 대피인원 백분위 × 0.6. 필요성 축은 '누가 얼마나 혜택'이 기준(H 편익과 같은 논리)이라 보장 인원을 더 무겁게
  self_sufficiency_rank_cap: 1.0           # 순위 계산 시 자립률 상한 (100% 넘는 초과 공급은 추가 가치 없음)
  grade_cuts: [0.30, 0.70]                 # S 점수 하위 30% 하 · 상위 30% 상
  self_sufficiency_cap: 3.0                # 표시 상한 (300% 이상은 "충분")
asof: "2026-11-16"
