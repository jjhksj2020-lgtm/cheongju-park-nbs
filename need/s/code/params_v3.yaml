# 필요성 · S 회복력 v3 — 자립형 태양광 공원등(분산 ESS) + 충전 허브(집중 ESS). tag: 실자료 / 가정
# 질문: 정전 시 이 공원이 대피 거점이 되면, 공원등과 허브가 밤 조명·휴대폰 충전·공용 부하를 몇 명분 감당하나?

lamp:                                   # 올인원 태양광 공원등 (예: Signify BRP216 LED20 Solar: PV 20 Wp, LiFePO4 50 Ah×3.2 V ≈ 160 Wh, 2,000 lm) · 실자료
  pv_wp: 20
  battery_wh: 160
  lumen: 2000
  coverage_m2: 150                      # 1기 담당 면적: 기둥 3~4 m, 간격 12~15 m 보행로 조명 설계 관행 → ≈150 ㎡ · 가정 (민감도 120~200)
  coverage_sensitivity: [120, 200]
  usb_ports: 2
  phones_per_port_night: 7              # 밤새 1포트 충전 대수 (160 Wh 중 조명 뒤 남는 ~70 Wh ÷ 폰 10 Wh ÷ 2포트 ≈ 3.5, 교대 충전 감안 7) · 가정 (민감도 5~10)
  phones_sensitivity: [5, 10]
  autonomy_nights: 2.5                  # 흐린 날 자립 (제품 통상 2~3일) · 실자료
  min_lamps: 1
  max_lamps: 200                        # 공원 1곳 상한 (시설부지 3 ha분; 대피 거점으로 쓰는 범위) · 가정 — 생태공원3(제방 258만㎡)·역사공원167 적용

facility_share:                         # 공원시설 부지면적 상한 (도시공원 및 녹지 등에 관한 법률 시행규칙 별표 4) · 실자료. 가로등은 시설부지(산책로·광장)에만
  소공원: 0.20
  어린이공원: 0.60
  근린공원: 0.40
  역사공원: 0.40                        # 주제공원 상한 없음 → 근린 값 · 가정
  문화공원: 0.40
  생태공원: 0.10

hub:                                    # 태양광 충전 스테이션(쉘터형): PV 600 W + ESS 5 kWh + 콘센트/USB · 가정 (시판 사양 범위)
  types: [근린공원, 역사공원, 문화공원]  # 1기 설치 대상; 소·어린이공원은 0
  ess_kwh: 5
  usable: 0.8
  phone_wh: 10
  pv_w: 600

evacuation:
  radius_m: 2000                        # 황지루이·이애란 2020 (율봉공원) · 실자료
  evac_rate: 0.30
  m2_per_person: 2.0

score:
  use_demand: false                     # false = 인구(대피 수요) 제외: S = 조명 수용 인원 백분위 × 0.6 + 충전 대수 백분위 × 0.4 (공급 능력만). 인구는 E 노출 축에서만 평가. 대피 인원·자립률은 참고 열
  weights: {covered_persons: 0.6, lighting_ratio: 0.4}   # use_demand=true 일 때: 조명 보장 인원 × 0.6 + 조명 자립률 × 0.4
  grade_cuts: [0.30, 0.70]
asof: "2026-11-18"
