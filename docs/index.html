<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>청주시 장기미집행 공원 40개소 | 3D 지표 지도</title>
  <link href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css" rel="stylesheet" />
  <link href="./style.css" rel="stylesheet" />
</head>
<body>
  <header>
    <h1>청주시 장기미집행 공원 40개소</h1>
    <span>3D 지표 비교 지도 · 연구용 프로토타입</span>
  </header>
  <main>
    <aside>
      <label for="metric">표시할 평가 지표</label>
      <select id="metric"></select>
      <p id="metricHelp"></p>
      <label for="view">지도 시점</label>
      <select id="view"><option value="3d">3D 상대높이</option><option value="2d">2D 평면</option></select>
      <div class="hint">막대 높이는 선택 지표의 상대값입니다. 실제 건물 높이 또는 지형 고도가 아닙니다.</div>
      <section class="statusBox" id="status">GeoJSON 불러오는 중…</section>
      <section class="legend" id="legend"></section>
      <section id="detail"><h2>공원 상세정보</h2><p>공원을 클릭하면 판정·지표·출처가 표시됩니다.</p></section>
      <small>청주시 행정판정을 대신하지 않습니다. 원자료·가정·미산정을 구분해야 합니다.</small>
    </aside>
    <div id="map" role="region" aria-label="청주시 3D 공간정보 지도"></div>
  </main>
  <script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
  <script src="./app.js"></script>
</body>
</html>
